<svg xmlns="http://www.w3.org/2000/svg" width="600" height="80" viewBox="0 0 600 80" role="img" aria-label="Verdicts: allow, rewrite, escalate, block" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title>Verdicts: allow, rewrite, escalate, block</title>
<rect x="0.5" y="0.5" width="599" height="79" rx="8" fill="#ffffff" stroke="#d0d7de"/><rect x="23" y="16" width="104" height="26" rx="13" fill="#16a34a"/><text x="75" y="33" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">ALLOW</text><text x="75" y="63" fill="#656d76" font-size="12" font-weight="400" text-anchor="middle" >let it through</text><rect x="173" y="16" width="104" height="26" rx="13" fill="#f59e0b"/><text x="225" y="33" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">REWRITE</text><text x="225" y="63" fill="#656d76" font-size="12" font-weight="400" text-anchor="middle" >fix and pass on</text><rect x="323" y="16" width="104" height="26" rx="13" fill="#ea580c"/><text x="375" y="33" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">ESCALATE</text><text x="375" y="63" fill="#656d76" font-size="12" font-weight="400" text-anchor="middle" >hold and re-check</text><rect x="473" y="16" width="104" height="26" rx="13" fill="#dc2626"/><text x="525" y="33" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0.5">BLOCK</text><text x="525" y="63" fill="#656d76" font-size="12" font-weight="400" text-anchor="middle" >stop the action</text>
</svg>
