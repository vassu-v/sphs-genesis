<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="S.H.O.A.V., pronounced SHOP. Shield for Hostile Operations and Agent Vulnerability. AI Bodyguard.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1419"/>
      <stop offset="1" stop-color="#171d26"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ffc247"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" rx="14" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="13.5" fill="none" stroke="#2a3340"/>
  <rect x="0" y="0" width="8" height="340" rx="4" fill="url(#accent)"/>

  <!-- left: name -->
  <text x="64" y="76" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" letter-spacing="4" fill="#7d8896">PRONOUNCED  <tspan fill="#ffc247" font-weight="700">SHOP</tspan></text>

  <text x="60" y="190" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="112" font-weight="800" letter-spacing="2" fill="#f2f4f7">S.H.O.A.V.</text>

  <text x="64" y="250" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="23" fill="#8b95a3"><tspan fill="#ff9d4d" font-weight="800" font-size="27">S</tspan>hield for <tspan fill="#ff9d4d" font-weight="800" font-size="27">H</tspan>ostile <tspan fill="#ff9d4d" font-weight="800" font-size="27">O</tspan>perations <tspan fill="#5b6572">&amp;</tspan> <tspan fill="#ff9d4d" font-weight="800" font-size="27">A</tspan>gent <tspan fill="#ff9d4d" font-weight="800" font-size="27">V</tspan>ulnerability</text>

  <!-- divider -->
  <line x1="780" y1="70" x2="780" y2="270" stroke="#2a3340" stroke-width="2"/>

  <!-- right: meaning -->
  <g transform="translate(830,96)">
    <path d="M28 0 L56 10 V32 C56 52 44 66 28 74 C12 66 0 52 0 32 V10 Z" fill="none" stroke="url(#accent)" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M15 34 L25 44 L42 24" fill="none" stroke="#ffc247" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="830" y="216" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="44" font-weight="800" fill="#f2f4f7">AI</text>
  <text x="830" y="262" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="44" font-weight="800" letter-spacing="1" fill="url(#accent)">BODYGUARD</text>
</svg>
