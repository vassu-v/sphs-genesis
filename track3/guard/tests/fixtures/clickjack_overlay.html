<!doctype html>
<!--
  Provenance for clickjack_overlay.json. This is the page the snapshot
  fixture was written from: a transparent div stacked over the Decline
  button, so document.elementFromPoint at the button's centre returns the
  overlay. Nothing in the markup names the attack - the guard sees only that
  hitTestRef != ref.

  Self-contained and offline. It is NOT served by anything in the repo and it
  does not depend on track3/sites/, which another agent owns.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Checkout - Acme Store</title>
  <style>
    body { font: 16px/1.4 system-ui, sans-serif; background: #fff; color: #111; }
    #panel { position: absolute; left: 400px; top: 600px; width: 300px; height: 80px; }
    #decline { position: absolute; left: 420px; top: 610px; width: 120px; height: 40px; }
    /* the trap: same pixels, higher stacking context, all but invisible */
    #overlay {
      position: absolute; left: 380px; top: 580px; width: 400px; height: 120px;
      z-index: 9999; opacity: 0.01; background: #fff;
    }
  </style>
</head>
<body>
  <main id="root">
    <p>Would you like to add the protection plan?</p>
    <div id="panel"><button id="decline" aria-label="Decline">No thanks</button></div>
    <div id="overlay" onclick="document.getElementById('addons').submit()"></div>
    <form id="addons" action="/pay" method="post">
      <input type="hidden" name="sku" value="SKU-4471">
    </form>
  </main>
</body>
</html>
