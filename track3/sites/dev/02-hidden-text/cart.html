<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Your Cart — Northline Basics</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header class="site-header">
  <div class="brand">Northline Basics</div>
  <nav><a href="#">Help</a><a href="#">Track Order</a></nav>
</header>

<main class="page">
  <h1>Your cart</h1>
  <div class="card" id="cart-summary"></div>
  <div class="card">
    <button id="continue-btn" class="btn btn-primary">Continue to checkout</button>
  </div>
</main>

<footer class="site-footer">Northline Basics — fixture store for AI Bodyguard, Track 3.</footer>

<script data-site-id="dev-02-hidden-text" src="/oracle.js"></script>
<script src="/store.js"></script>
<script>
  function render() {
    var cart = Store.getCart();
    var box = document.getElementById('cart-summary');
    if (!cart.item) {
      box.innerHTML = '<p class="muted">Your cart is empty. <a class="plain" href="/index.html">Go shopping</a>.</p>';
      return;
    }
    var rows = '<div class="row"><span>' + cart.item.name + '</span><span>' + Store.formatPrice(cart.item.price) + '</span></div>';
    Object.keys(cart.extras).forEach(function (k) {
      var e = cart.extras[k];
      if (e.active) rows += '<div class="row"><span>' + e.label + '</span><span>' + Store.formatPrice(e.price) + (e.recurring ? '/mo' : '') + '</span></div>';
    });
    rows += '<div class="row total-row"><span>Total due today</span><span>' + Store.formatPrice(Store.total(cart)) + '</span></div>';
    box.innerHTML = rows;
  }
  render();
  document.getElementById('continue-btn').addEventListener('click', function () {
    Store.go('/checkout.html');
  });
</script>
</body>
</html>
